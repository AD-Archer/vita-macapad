# Builds macapad.vpk. Every push to main also releases it as the next version (v1.0, v1.1, ...),
# tagged by this workflow, so nobody has to make tags. The Vita keeps an app's version as two
# numbers, XX.YY, so the release tags are two numbers too: after v1.99 comes v2.0. Put [major] in
# a commit message to go to the next major version sooner.
# The newest release is GitHub's "latest", so this URL (and its QR code, which VitaShell can scan
# and install from) always gets the newest VPK:
#   https://github.com/<owner>/<repo>/releases/latest/download/macapad.vpk
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time per branch, so two quick pushes can't pick the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      app_ver: ${{ steps.next.outputs.app_ver }}
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: |
          last=$(gh api "repos/$GH_REPO/tags" --paginate -q '.[].name' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$last" ]; then
            major=1; minor=0
          else
            IFS=. read -r major minor <<< "${last#v}"
            case "$MESSAGES" in
              *"[major]"*) major=$((major + 1)); minor=0 ;;
              *) minor=$((minor + 1)) ;;
            esac
            if [ "$minor" -gt 99 ]; then major=$((major + 1)); minor=0; fi
          fi
          echo "Last release: ${last:-none}, next: v$major.$minor"
          echo "version=$major.$minor" >> "$GITHUB_OUTPUT"
          printf 'app_ver=%02d.%02d\n' "$major" "$minor" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # pull requests skip the version job but still build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VPK
        run: |
          cmake -S . -B build -DVITA_VERSION="${{ needs.version.outputs.app_ver || '00.01' }}"
          cmake --build build -j"$(nproc)"
          cp build/macapad.vpk build/eboot.bin .

      - uses: actions/upload-artifact@v4
        with:
          name: macapad
          path: |
            macapad.vpk
            eboot.bin
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
      VPK_URL: https://github.com/${{ github.repository }}/releases/latest/download/macapad.vpk
    steps:
      # checkout first: it empties the directory, which would take the downloaded build with it
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macapad

      - name: Make the QR code
        run: |
          sudo apt-get install -y -qq qrencode >/dev/null
          qrencode -s 8 -m 2 -o assets/qr.png "$VPK_URL"
          cp assets/qr.png macapad-qr.png

      # The README and docs show assets/qr.png, so keep the committed copy in step with the URL
      # (it only changes if the repo is renamed or moved). Pushes made with github.token don't
      # start another run.
      - name: Commit the QR code if it changed
        run: |
          if git diff --quiet -- assets/qr.png; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/qr.png
          git commit -m "Update the VitaShell QR code [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish
        env:
          COMMITS: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          {
            echo "## Install with VitaShell"
            echo
            echo "In VitaShell, hold **←** on the D-pad and press **○** to open the QR code scanner, then scan this."
            echo "It downloads the newest \`macapad.vpk\` and offers to install it."
            echo
            echo "![QR code](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/macapad-qr.png)"
            echo
            echo "Or copy \`macapad.vpk\` to your Vita (VitaShell's FTP or USB, say to \`ux0:data/\`), open it in VitaShell and choose Install."
            echo
            echo "Already installed? Installing the new VPK over it keeps your pages and pairing (they're in \`ux0:data/macapad/\`)."
            echo "\`eboot.bin\` is the app alone, for copying to \`ux0:app/MCPD07317/\` over FTP."
            changes=$(printf '%s' "$COMMITS" | jq -r '.[]? | split("\n")[0] | "- " + .')
            if [ -n "$changes" ]; then
              echo
              echo "## Changes"
              echo
              echo "$changes"
            fi
          } > notes.md
          gh release create "$TAG" macapad.vpk eboot.bin macapad-qr.png \
            --target "$GITHUB_SHA" --title "Macapad $TAG" --notes-file notes.md --latest
